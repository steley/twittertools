# twittertools.com — Apache vhost (replaces the certbot-generated SSL vhost)
#
# Install on the VPS (Apache 2.4, certbot certificate already issued):
#   sudo cp /etc/apache2/sites-enabled/twittertools-le-ssl.conf \
#           /etc/apache2/sites-enabled/twittertools-le-ssl.conf.bak
#   sudo cp deploy/apache-twittertools.conf \
#           /etc/apache2/sites-enabled/twittertools-le-ssl.conf
#   sudo a2enmod proxy proxy_http headers
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Requires: mod_ssl (already on), mod_proxy, mod_proxy_http, mod_headers.
#
# NOTE: DocumentRoot is .../dist — deliberately NOT /var/www/twittertools,
# so that server/ (source) and deploy/ (configs) stay off the public web.

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin postmaster@twittertools.com
	ServerName twittertools.com
	ServerAlias www.twittertools.com

	DocumentRoot /var/www/twittertools/dist
	<Directory /var/www/twittertools/dist>
		Options -Indexes
		AllowOverride None
		Require all granted
		DirectoryIndex index.html
	</Directory>

	# API -> local aiohttp service (server/downloader_server.py, systemd: twittertools-api)
	ProxyRequests Off
	ProxyPass        /api/ http://127.0.0.1:8787/api/ retry=0 timeout=600
	ProxyPassReverse /api/ http://127.0.0.1:8787/api/
	# liveness probe for external uptime monitors (returns "ok")
	ProxyPass        /health http://127.0.0.1:8787/health retry=0
	ProxyPassReverse /health http://127.0.0.1:8787/health

	# Rate limiting keys on the real client: the aiohttp service prefers
	# CF-Connecting-IP (set by Cloudflare from the TCP peer, not spoofable
	# through the proxy). Clearing the client-supplied X-Forwarded-For here
	# keeps the service's XFF fallback honest for direct-to-origin hits.
	# Branded 404 (Astro builds src/pages/404.astro -> dist/404.html)
	ErrorDocument 404 /404.html

	RequestHeader unset X-Forwarded-For
	RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"

# Cloudflare-only boundary for the API and the health probe. This closes the
# direct-to-origin path that lets anyone spoof CF-Connecting-IP to rotate
# per-IP rate-limit buckets (AUDIT-001). Keep the ranges fresh from
# https://www.cloudflare.com/ips/ — stale ranges 403 legitimate traffic (the
# UptimeRobot monitor on /health doubles as the alarm for that), and give the
# port-80 vhost the same block if it proxies /api/.
	<LocationMatch "^/(api/|health)">
		Require local
		Require ip 173.245.48.0/20
		Require ip 103.21.244.0/22
		Require ip 103.22.200.0/22
		Require ip 103.31.4.0/22
		Require ip 141.101.64.0/18
		Require ip 108.162.192.0/18
		Require ip 190.93.240.0/20
		Require ip 188.114.96.0/20
		Require ip 197.234.240.0/22
		Require ip 198.41.128.0/17
		Require ip 162.158.0.0/15
		Require ip 104.16.0.0/13
		Require ip 104.24.0.0/14
		Require ip 172.64.0.0/13
		Require ip 131.0.72.0/22
		Require ip 2400:cb00::/32
		Require ip 2606:4700::/32
		Require ip 2803:f800::/32
		Require ip 2405:b500::/32
		Require ip 2405:8100::/32
		Require ip 2a06:98c0::/29
		Require ip 2c0f:f248::/32
	</LocationMatch>

	# Astro assets are content-hashed: cache forever
	<LocationMatch "^/_astro/">
		Header set Cache-Control "public, max-age=31536000, immutable"
	</LocationMatch>

	# hardening
	Header always set X-Content-Type-Options "nosniff"
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	Header always set X-Frame-Options "SAMEORIGIN"
	# The site is HTTPS-only; telling browsers to remember it prevents
	# downgrade attempts. Remove the "includeSubDomains" part if a subdomain
	# ever needs plain HTTP.
	Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
	# The site is never meant to be framed (clickjacking protection).
	# CSP-Report-Only: observe real violations before enforcing. Reports land
	# in /api/csp-report (visible in /api/healthz as csp_report).
	Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pbs.twimg.com https://video.twimg.com https://ton.twimg.com; connect-src 'self' https://pbs.twimg.com https://video.twimg.com; media-src 'self' https://video.twimg.com blob:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/csp-report"
	Header always set Content-Security-Policy "frame-ancestors 'self'"
	<FilesMatch "^\.">
		Require all denied
	</FilesMatch>

	ErrorLog ${APACHE_LOG_DIR}/twittertools-error.log
	CustomLog ${APACHE_LOG_DIR}/twittertools-access.log combined

	Include /etc/letsencrypt/options-ssl-apache.conf
	SSLCertificateFile /etc/letsencrypt/live/twittertools.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/twittertools.com/privkey.pem
</VirtualHost>
</IfModule>
