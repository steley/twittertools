# twittertools.com — nginx site config (HTTP version)
# Static site from twittertools/dist + reverse proxy for the API service.
#
# Install:
#   cp deploy/nginx-twittertools.conf /etc/nginx/sites-available/twittertools
#   ln -sf /etc/nginx/sites-available/twittertools /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# After certificates are issued (acme.sh, see README), switch to the HTTPS
# variant following the same pattern as the domain4sale project: one server
# block per cert, ssl_certificate lines added, port 80 block redirecting.

    geo $cf_api_blocked {
        default 1;
        173.245.48.0/20 0;
        103.21.244.0/22 0;
        103.22.200.0/22 0;
        103.31.4.0/22 0;
        141.101.64.0/18 0;
        108.162.192.0/18 0;
        190.93.240.0/20 0;
        188.114.96.0/20 0;
        197.234.240.0/22 0;
        198.41.128.0/17 0;
        162.158.0.0/15 0;
        104.16.0.0/13 0;
        104.24.0.0/14 0;
        172.64.0.0/13 0;
        131.0.72.0/22 0;
        2400:cb00::/32 0;
        2606:4700::/32 0;
        2803:f800::/32 0;
        2405:b500::/32 0;
        2405:8100::/32 0;
        2a06:98c0::/29 0;
        2c0f:f248::/32 0;
    }

server {
    listen 80;
    listen [::]:80;
    server_name twittertools.com www.twittertools.com;

    root /var/www/twittertools/dist;
    index index.html;

    # Basic hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Static assets hashed by Astro: cache hard
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API -> local aiohttp service
    # Cloudflare-only boundary (mirror of the Apache vhost): visitors always
    # arrive from a CF edge IP; direct-to-origin hits get 403 so a spoofed
    # CF-Connecting-IP cannot rotate rate-limit buckets. Ranges from
    # https://www.cloudflare.com/ips/ — keep in sync with the Apache vhost.


    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        if ($cf_api_blocked) { return 403; }
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The aiohttp service prefers CF-Connecting-IP (set by Cloudflare
        # from the TCP peer, not spoofable through the proxy); overwriting
        # XFF here keeps its fallback honest for direct-to-origin hits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;      # video streams can be large
        proxy_buffering off;          # stream downloads straight through
        if ($cf_api_blocked) { return 403; }
    }

    # Clean URLs: /tweet-character-counter -> its .html file
    # CSP-Report-Only (observe first; violations land in /api/healthz csp_report)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pbs.twimg.com https://video.twimg.com https://ton.twimg.com; connect-src 'self' https://pbs.twimg.com https://video.twimg.com; media-src 'self' https://video.twimg.com blob:; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; report-uri /api/csp-report" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /404.html;
    }

    # Sitemap & robots
    location = /sitemap-index.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
