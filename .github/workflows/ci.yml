name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Astro check + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp   # mcp server deps (its tests run under the root vitest)
      - run: npx astro check
      - run: npx vitest run
      - run: npm run build
      - name: Production build must not contain dev-only API references
        run: |
          test -d dist || { echo "dist/ directory missing" >&2; exit 1; }
          # no `! grep` here: it would treat grep's exit code 2 (missing dir,
          # bad path) as success — fail explicitly on a match instead
          if grep -rq '127.0.0.1:8787' dist/; then
            echo "Dev-only API reference found in production build" >&2
            exit 1
          fi

  backend:
    name: pyflakes + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'   # match the deployment target; no 3.10+ syntax allowed
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes downloader_server.py mock_test.py dev_mocks.py dev_proxy.py
      - name: Offline integration suite (mock syndication + media CDN)
        run: python mock_test.py

  smoke:
    name: Page smoke tests (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - name: Start local stack (mock endpoints + API + dist proxy)
        run: |
          python server/dev_mocks.py > /tmp/mocks.log 2>&1 &
          TT_SYNDICATION_URL=http://127.0.0.1:8898/tweet-result \
          TT_MEDIA_HOSTS=127.0.0.1 \
          TT_CACHE_FILE="" \
          python server/downloader_server.py > /tmp/api.log 2>&1 &
          python server/dev_proxy.py > /tmp/proxy.log 2>&1 &
          for port in 8898 8787 8080; do
            ready=0
            for i in $(seq 1 30); do
              curl -s -o /dev/null "http://127.0.0.1:$port/" && { ready=1; break; }
              sleep 1
            done
            [ "$ready" = 1 ] || { echo "port $port never became ready" >&2; exit 1; }
          done
          # -f so an HTTP error status fails the step instead of passing
          curl -sf http://127.0.0.1:8080/api/healthz
      - name: Run smoke tests
        run: node scripts/smoke.mjs
      - name: Stack logs on failure
        if: failure()
        run: |
          tail -20 /tmp/mocks.log /tmp/api.log /tmp/proxy.log || true
